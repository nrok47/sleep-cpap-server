<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บริการตรวจการนอนหลับและติดตาม CPAP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f9;--card:#fff;--tx:#17252e;--mu:#5b6b75;--ac:#0f6b7a;--ac2:#e3f2f4;--bd:#d9e2e7;--wa:#b45309;--ok:#15803d;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171c;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4cc3d4;--ac2:#16353b;--bd:#2a3b44;--wa:#f5b44d;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0f171c;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4cc3d4;--ac2:#16353b;--bd:#2a3b44;--wa:#f5b44d;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Noto Sans Thai',system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#06242a}}
header h1{margin:0;font-size:18px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on,:root:not([data-theme="light"]) .btn.pri{color:#06242a}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.q{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.q select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--ac2);border-radius:12px;padding:10px 12px}.stat b{font-size:24px;display:block;color:var(--ac)}.stat span{font-size:12px;color:var(--mu)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:600}
.over{color:var(--er);font-weight:600}.mu{color:var(--mu);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600}
.case{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mu)}
.hide{display:none}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:780px;width:94%;max-height:92vh;overflow:auto}.dt{display:flex;gap:6px}.dt select{flex:1;min-width:0;padding:9px 6px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.sc{border-radius:18px;overflow:hidden;background:#f7f0e3;color:#1c2a4d;margin-bottom:14px;font-family:'Noto Sans Thai',sans-serif}
.sc h1,.sc h2,.sc h3,.sc h4{font-family:'Noto Serif Thai','Noto Sans Thai',serif;color:#1c2a4d}
.sc .hero{background:linear-gradient(135deg,#5b4b9e,#8a7bd0);color:#fff;padding:22px 20px}
.sc .hero h1{margin:0 0 8px;font-size:26px;color:#fff}.sc .hero h1 span{color:#ffd77a}.sc .hero p{margin:0;font-size:14px;opacity:.95}
.sc .sb{padding:22px 18px}.sc .eb{font-size:13px;letter-spacing:.04em;color:#5b6070}
.sc h2{font-size:22px;margin:2px 0 6px}.sc .sub{font-size:14px;color:#5b6070;margin:0 0 14px}
.sc label{color:#4a5068}.sc input,.sc select{background:#fffdf8;color:#1c2a4d;border-color:#d8cfbd}
.seg{display:inline-flex;gap:6px;background:#ece3d0;border-radius:14px;padding:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 14px;font:600 14px 'Noto Sans Thai',sans-serif;color:#5b5648;cursor:pointer}
.seg button.on{background:#1c2a4d;color:#fff}
.bar{height:5px;background:#e8dfcb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#5b4b9e;transition:width .2s}
.cnt{font:12px monospace;color:#5b5648;margin:6px 0 14px}
.qc{background:#fffdf8;border:1px solid #e3dac6;border-radius:16px;padding:16px;margin-bottom:12px}
.tg{display:inline-block;background:#fdebc8;color:#8a5a10;font:600 11px monospace;padding:2px 9px;border-radius:6px}
.qh{display:flex;gap:13px;align-items:flex-start}.qh>div{min-width:0}
.ic{flex:0 0 46px;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#fdebc8,#f8dca8);color:#8a5a10;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #f0d49a;transition:transform .18s ease}
.ic svg{width:26px;height:26px}
.qc:hover .ic{transform:translateY(-2px) rotate(-3deg)}
@media(max-width:480px){.ic{flex-basis:38px;width:38px;height:38px;border-radius:12px}.ic svg{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){.ic{transition:none}.qc:hover .ic{transform:none}}
.qc h4{font-size:17px;margin:8px 0 4px}.qc p{font-size:13px;color:#5b6070;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#f5eee1;border:1px solid #ddd2bd;border-radius:10px;padding:13px;font:15px 'Noto Sans Thai',sans-serif;color:#1c2a4d;cursor:pointer}
.opts:not(.two) .opt{flex-direction:column;align-items:flex-start}
.opt em{font:12px monospace;color:#7a7364;font-style:normal}.opt.sel{background:#1c2a4d;color:#fff;border-color:#1c2a4d}.opt.sel em{color:#cdd3ea}
.sum{background:#1c2a4d;color:#fff;border-radius:18px;padding:20px;margin-top:18px}.sum h3{color:#fff;margin:4px 0 14px;font-size:18px}
.sum .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum .two>div{background:#2a3860;border-radius:12px;padding:12px 14px;font-size:14px;color:#aab3d3}
.sum small{font:11px monospace;display:block;margin-bottom:4px}.sum b{color:#fff;font-size:22px}
.sum hr{border:0;border-top:1px solid #3b4a78;margin:14px 0}#s3{font-size:14px}
.disc{background:#efe4cb;border-radius:12px;padding:12px 14px;font-size:12px;color:#5b5648;margin-top:16px}
@media(max-width:480px){.sum .two{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:1000px}.cdy{border:1px solid var(--bd);border-radius:8px;min-height:96px;padding:4px;font-size:12px}.cdy.today{border:2px solid var(--ac)}.slot{margin-top:3px;padding:3px 6px;border-radius:5px;line-height:1.35;word-break:break-word}.slot.b{background:var(--ac2);cursor:pointer}.slot.f{color:var(--mu)}.slot.x{background:rgba(185,28,28,.15);color:var(--er);cursor:pointer}
</style>
</head>
<body>
<header><h1>บริการตรวจการนอนหลับและติดตาม CPAP</h1><p>โรงพยาบาลศูนย์อนามัยที่ 10 อุบลราชธานี</p><div id="who" class="hide" style="margin-top:6px;font-size:13px"></div></header>
<main>
<div id="msg" class="note">กำลังเชื่อมต่อระบบ…</div>
<div class="tabs" id="tabs" style="margin-top:12px"></div>
<div id="app"></div>
<p id="stafflink" style="text-align:center;margin:22px 0"><a href="#" id="lgn" class="mu">เจ้าหน้าที่เข้าสู่ระบบ</a></p>
</main>
<dialog id="dlg"></dialog>
<dialog id="lg" style="max-width:360px"><h2>เจ้าหน้าที่เข้าสู่ระบบ</h2><label>ชื่อผู้ใช้</label><input id="lu" autocomplete="username"><label>รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password"><div id="le" class="over" style="margin-top:6px"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="lgo">เข้าสู่ระบบ</button><button class="btn" id="lcl">ยกเลิก</button></div></dialog>
<script>
const STAGES=[
{k:"callback",n:"รอโทรกลับ",task:"โทรกลับและนัดประเมิน",own:"เจ้าหน้าที่รับนัด",d:2},
{k:"assess",n:"นัดประเมินและพบแพทย์",task:"ประเมินสุขภาพและพบแพทย์",own:"พยาบาล / แพทย์",d:7},
{k:"sleep",n:"รอตรวจการนอนหลับ",task:"ตรวจการนอนหลับ (PSG/HSAT)",own:"ห้องตรวจการนอนหลับ",d:14},
{k:"result",n:"รอรับรองผล / แจ้งผล",task:"รับรองผลและแจ้งผู้ป่วย",own:"แพทย์ / พยาบาลคลินิก",d:3},
{k:"device",n:"รอเครื่อง CPAP",task:"รับเครื่องและสอนใช้",own:"พยาบาล / ผู้สอนใช้เครื่อง",d:14},
{k:"follow",n:"ติดตามการใช้ CPAP",task:"โทรติดตามและทบทวนข้อมูลเครื่อง",own:"พยาบาล / แพทย์",d:14},
{k:"closed",n:"ปิดเคส",task:"-",own:"-",d:0}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sg=k=>STAGES.find(s=>s.k===k)||STAGES[0];
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>{if(!s||s==="-")return"-";const[y,m,d]=s.split("-");return d+"/"+m+"/"+(+y+543)};
let db,col,uid="",isStaff=false,view="patient",cases=[],ready=false,pub=true,flash="";

let lastSig="",isAdmin=false;
const API=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"fetch"},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error((j&&j.error)||"error"),{status:r.status});return j};
async function poll(first){
  try{const x=await API("GET","/api/cases"),sig=JSON.stringify(x);
    if(first||sig!==lastSig){lastSig=sig;cases=x;ready=true;if(view!=="admin")render()}}
  catch(e){if(e.status===401)location.reload()}
}
col={doc:id=>({set:d=>API("PUT","/api/cases/"+id,d).then(()=>poll()),update:d=>API("PATCH","/api/cases/"+id,d).then(r=>{if(r&&r._rev){const k=cases.find(x=>x.id===id);if(k)k._rev=r._rev}return poll()}),delete:()=>API("DELETE","/api/cases/"+id).then(()=>poll())})};
async function init(){
  try{const cfg=await API("GET","/api/config");CLINIC_PHONE=cfg.clinicPhone||""}catch(e){}
  $("#lgn").onclick=e=>{e.preventDefault();$("#lg").showModal();$("#lu").focus()};
  $("#lcl").onclick=()=>$("#lg").close();
  const go=async()=>{try{await API("POST","/api/login",{username:$("#lu").value,password:$("#lp").value});location.reload()}catch(e){$("#le").textContent=e.message}};
  $("#lgo").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()};
  try{
    const me=await API("GET","/api/me");
    if(!me.staff){render();return}
    uid="staff:"+me.username;isStaff=true;isAdmin=me.role==="admin";pub=false;view="staff";
    $("#stafflink").className="hide";$("#who").className="";
    $("#who").innerHTML=esc(me.name)+" ("+(isAdmin?"ผู้ดูแลระบบ":"เจ้าหน้าที่")+") · <a href='#' id='lo' style='color:inherit'>ออกจากระบบ</a>";
    $("#lo").onclick=async e=>{e.preventDefault();try{await API("POST","/api/logout")}catch(x){}location.reload()};
    await poll(true);setInterval(poll,5000);
  }catch(e){render()}
}
async function loadAdmin(){
  try{
    const[us,au]=await Promise.all([API("GET","/api/users"),API("GET","/api/audit")]);
    const dt=s=>new Date(s).toLocaleString("th-TH");
    $("#adm").innerHTML=`<h2>ผู้ใช้งานระบบ</h2><div class="scroll"><table><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr>
${us.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.display)}</td><td>${u.role==="admin"?"ผู้ดูแลระบบ":"เจ้าหน้าที่"}</td><td>${u.active?"ใช้งาน":"<span class='over'>ปิดใช้งาน</span>"}</td>
<td class="row"><button class="btn" data-pw="${u.id}">รีเซ็ตรหัสผ่าน</button><button class="btn" data-ac="${u.id}" data-v="${u.active?0:1}">${u.active?"ปิดใช้งาน":"เปิดใช้งาน"}</button><button class="btn" data-ro="${u.id}" data-v="${u.role==="admin"?"staff":"admin"}">${u.role==="admin"?"เปลี่ยนเป็นเจ้าหน้าที่":"เปลี่ยนเป็นผู้ดูแล"}</button></td></tr>`).join("")}</table></div>
<h3>เพิ่มผู้ใช้</h3><div class="g2"><div><label>ชื่อผู้ใช้ (อังกฤษ/ตัวเลข)</label><input id="nu"></div><div><label>ชื่อที่แสดง</label><input id="nd"></div><div><label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="np" type="password" autocomplete="new-password"></div><div><label>สิทธิ์</label><select id="nr"><option value="staff">เจ้าหน้าที่</option><option value="admin">ผู้ดูแลระบบ</option></select></div></div>
<p><button class="btn pri" id="nadd">เพิ่มผู้ใช้</button> <span id="nm" class="over"></span></p>
<h2 style="margin-top:22px">บันทึกการใช้งาน (ล่าสุด 300 รายการ)</h2><div class="scroll"><table><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>IP</th></tr>
${au.map(a=>`<tr><td>${esc(dt(a.ts))}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.ip)}</td></tr>`).join("")}</table></div>`;
    const patch=async(id,b)=>{try{await API("PATCH","/api/users/"+id,b);loadAdmin()}catch(e){alert(e.message)}};
    document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{const p=prompt("รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)");if(p)patch(b.dataset.pw,{password:p})});
    document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>patch(b.dataset.ac,{active:+b.dataset.v}));
    document.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>patch(b.dataset.ro,{role:b.dataset.v}));
    $("#nadd").onclick=async()=>{try{await API("POST","/api/users",{username:$("#nu").value,display:$("#nd").value,password:$("#np").value,role:$("#nr").value});loadAdmin()}catch(e){$("#nm").textContent=e.message}};
  }catch(e){$("#adm").textContent="โหลดไม่สำเร็จ"}
}
function tabs(){
  let h=`<button class="${view==="patient"?"on":""}" data-v="patient">${isStaff?"กรอกแทนผู้รับบริการ":"ผู้รับบริการ"}</button>`;
  if(isStaff)h+=`<button class="${view==="staff"?"on":""}" data-v="staff">เจ้าหน้าที่ดูแลระบบ</button>`;
  if(isAdmin)h+=`<button class="${view==="admin"?"on":""}" data-v="admin">ผู้ใช้งานและบันทึกการใช้งาน</button>`;
  $("#tabs").innerHTML=isStaff?h:"";
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;flash="";render()});
}
function render(){
  $("#msg").className="hide";tabs();
  if(view==="admin"&&isAdmin){$("#app").innerHTML='<div id="adm" class="card">กำลังโหลด…</div>';loadAdmin();return}
  $("#app").innerHTML=view==="staff"&&isStaff?staffHtml():patientHtml();
  view==="staff"&&isStaff?bindStaff():bindPatient();
}
/* ---------- ผู้รับบริการ ---------- */
// ---------- ไอคอนประจำข้อคำถาม (SVG ฝังในไฟล์ ไม่โหลดจากข้างนอก ใช้ได้ตอนเน็ตหลุด) ----------
const SVG=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO={
 S:SVG('<circle cx="9" cy="13" r="6"/><path d="M6.4 12.3c.6.7 1.4.7 2 0M9.6 12.3c.6.7 1.4.7 2 0"/><path d="M7.6 16c1-.8 2.4-.8 3.4 0"/><path d="M15.5 4.5h3l-3 3h3"/><path d="M19 9.5h2.5L19 12h2.5"/>'),
 T:SVG('<path d="M4 9h11v5.5A4.5 4.5 0 0 1 10.5 19h-2A4.5 4.5 0 0 1 4 14.5z"/><path d="M15 10.5h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M7 4.5c.6.9.6 1.4 0 2.3M11 4.5c.6.9.6 1.4 0 2.3"/>'),
 O:SVG('<path d="M1.5 12S4.8 6.8 9 6.8 16.5 12 16.5 12 13.2 17.2 9 17.2 1.5 12 1.5 12z"/><circle cx="9" cy="12" r="2.1"/><path d="M19.5 8.5v7M22.5 8.5v7"/>'),
 P:SVG('<path d="M12 20s-7.5-4.6-7.5-9.7A3.9 3.9 0 0 1 12 6.9a3.9 3.9 0 0 1 7.5 3.4C19.5 15.4 12 20 12 20z"/><path d="M6.5 12h2.2l1.3-2.2L12 14l1.4-2h3.1"/>'),
 B:SVG('<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M12 15.2v-3.4"/><path d="M8.2 11.6a5 5 0 0 1 7.6 0"/><path d="M12 5v1.6"/>'),
 A:SVG('<path d="M7 3h10M7 21h10"/><path d="M7.5 3v2.6c0 2.4 3.2 3.5 3.2 6.4s-3.2 4-3.2 6.4V21"/><path d="M16.5 3v2.6c0 2.4-3.2 3.5-3.2 6.4s3.2 4 3.2 6.4V21"/>'),
 N:SVG('<rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M7 8.5v3M10 8.5v2M13 8.5v3M16 8.5v2"/>'),
 G:SVG('<circle cx="8.5" cy="14.5" r="4"/><path d="M8.5 18.5v3.2M6.9 20.1h3.2"/><circle cx="16.2" cy="8.2" r="3.6"/><path d="M18.8 5.6 22 2.4M19.2 2.4H22v2.8"/>')
};
const ESSI=[

  d.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{d.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#p1").classList.toggle("hide",b.dataset.p!=="p1");$("#p2").classList.toggle("hide",b.dataset.p!=="p2")});
  $("#dx").onclick=()=>d.close();
  const get=()=>({name:$("#dnm").value.trim()||c.name,phone:$("#dph").value.trim(),time:$("#dtm").value,stage:$("#dsg").value,nextTask:$("#dnt").value.trim(),hn:$("#dh").value.trim(),owner:$("#do").value.trim(),due:getD("dd"),note:$("#dn").value.trim()});
  $("#dsg").onchange=()=>{const g=sg($("#dsg").value);$("#dnt").value=g.task;$("#do").value=g.own};
  $("#del").onclick=()=>{$("#dm").innerHTML='ลบเคสนี้ถาวร? <button class="btn" id="dy" style="color:var(--er)">ยืนยันลบ</button> <button class="btn" id="dc">ยกเลิก</button>';
    $("#dy").onclick=async()=>{try{await col.doc(id).delete();d.close()}catch(e){$("#dm").textContent="ลบไม่สำเร็จ"}};$("#dc").onclick=()=>{$("#dm").textContent=""}};
  $("#ds").onclick=async()=>{const v=get();const log=[...(c.log||[])];
    if(v.note&&v.note!==c.note)log.push({d:today(),t:"บันทึก: "+v.note});
    if(v.stage!==c.stage)log.push({d:today(),t:"แก้ไขสถานะเป็น: "+sg(v.stage).n});else if(v.name!==c.name||v.phone!==c.phone)log.push({d:today(),t:"แก้ไขข้อมูลผู้รับบริการ"});
    try{await col.doc(id).update({...v,log,_rev:c._rev});d.close()}catch(e){$("#dm").textContent=saveErr(e)}};
  if(nx)$("#da").onclick=async()=>{const v=get();const log=[...(c.log||[]),{d:today(),t:`เสร็จ "${c.nextTask}" → ${nx.n}`}];
    try{await col.doc(id).update({name:v.name,phone:v.phone,time:v.time,hn:v.hn,note:v.note,stage:nx.k,nextTask:nx.task,owner:nx.own,due:nx.d?addDays(nx.d):"-",log,_rev:c._rev});d.close()}catch(e){$("#dm").textContent=saveErr(e)}};
  $("#as").onclick=async()=>{
    const o={};AK.forEach(k=>{const e=$("#a_"+k);o[k]=e.type==="checkbox"?e.checked:e.value.trim()});
    DK.forEach(k=>o[k]=getD("a_"+k));
    if(o.cd!=="has"){o.hyp=o.dm=o.dlp=o.othOn=false;o.otherDz=""}
    o.bmi=$("#a_bmi").value;o.s_bmi=$("#a_s_bmi").value;
    if(o.sleepDate&&o.sleepRoom){const cf=cases.find(x=>x.id!==id&&x.assess&&x.assess.sleepDate===o.sleepDate&&x.assess.sleepRoom===o.sleepRoom);if(cf){$("#am").textContent="ห้อง "+o.sleepRoom+" วันที่ "+fd(o.sleepDate)+" มีนัดแล้ว ("+cf.name+") กรุณาเลือกห้องหรือวันอื่น";return}}o.tests={};TESTS.forEach(x=>{o.tests[x[0]]={on:$("#t_on_"+x[0]).checked,due:getD("t_due_"+x[0])}});o.tests.oth.name=$("#t_name_oth").value.trim();
    const nmTh=(o.fnTh+" "+o.lnTh).trim();
    const log=[...(c.log||[]),{d:today(),t:"บันทึกประเมินก่อนตรวจ"+(Object.values(o.tests).some(v=>v&&v.on)?" (สั่งตรวจเพิ่มเติม)":"")}];
    try{await col.doc(id).update({assess:o,hn:o.hn||c.hn,phone:o.phone||c.phone,log,_rev:c._rev});$("#am").textContent="บันทึกแล้ว"}catch(e){$("#am").textContent=saveErr(e)}};
}
render();init();
</script>
</body>
</html>
