<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บริการตรวจการนอนหลับและติดตาม CPAP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f9;--card:#fff;--tx:#17252e;--mu:#5b6b75;--ac:#0f6b7a;--ac2:#e3f2f4;--bd:#d9e2e7;--wa:#b45309;--ok:#15803d;--er:#b91c1c;--on-ac:#fff;--surf:#eaf1f4;--surf2:#fff;--ink:#12303d;--ink2:#5b6b75;--fill:#dceef1;--solid:#12303d;--solid2:#1d4a60;--solid-bd:#2c5d74;--solid-tx:#fff;--solid-mu:#a9c7d4;--meter:#0b2430;--warm:#f6e3c4;--warm2:#f0d4a4;--warm-bd:#e8c98f;--warm-tx:#8a5a10;--gold:#f0b968;--gold-h:#e8a844;--chip-tx:#0b1a24;--rk-hi:#f09a8c;--rk-mid:#f0b968;--rk-lo:#9ee6b8;--okbg:#e7f5ec;--okbd:#9fd3b4;--oktx:#176a3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171c;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4cc3d4;--ac2:#16353b;--bd:#2a3b44;--wa:#f5b44d;--ok:#4ade80;--er:#f87171;--on-ac:#06242a;--surf:#121c22;--surf2:#18242b;--ink:#e6eef2;--ink2:#9bb0bb;--fill:#16353b;--solid:#15323d;--solid2:#1d3b49;--solid-bd:#2c5466;--solid-tx:#e8f1f5;--solid-mu:#a0bdc9;--meter:#0a1a22;--warm:#3a2e1a;--warm2:#4a3a20;--warm-bd:#5c4826;--warm-tx:#f0b968;--gold:#f0b968;--gold-h:#ffcf87;--chip-tx:#0b1a24;--rk-hi:#f09a8c;--rk-mid:#f0b968;--rk-lo:#9ee6b8;--okbg:#133026;--okbd:#2f6b4d;--oktx:#7fd6a5}}
:root[data-theme="dark"]{--bg:#0f171c;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4cc3d4;--ac2:#16353b;--bd:#2a3b44;--wa:#f5b44d;--ok:#4ade80;--er:#f87171;--on-ac:#06242a;--surf:#121c22;--surf2:#18242b;--ink:#e6eef2;--ink2:#9bb0bb;--fill:#16353b;--solid:#15323d;--solid2:#1d3b49;--solid-bd:#2c5466;--solid-tx:#e8f1f5;--solid-mu:#a0bdc9;--meter:#0a1a22;--warm:#3a2e1a;--warm2:#4a3a20;--warm-bd:#5c4826;--warm-tx:#f0b968;--gold:#f0b968;--gold-h:#ffcf87;--chip-tx:#0b1a24;--rk-hi:#f09a8c;--rk-mid:#f0b968;--rk-lo:#9ee6b8;--okbg:#133026;--okbd:#2f6b4d;--oktx:#7fd6a5}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Noto Sans Thai',system-ui,sans-serif}
header{background:var(--ac);color:var(--on-ac);padding:14px 16px}
header h1{margin:0;font-size:18px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on,.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.q{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.q select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--ac2);border-radius:12px;padding:10px 12px}.stat b{font-size:24px;display:block;color:var(--ac)}.stat span{font-size:12px;color:var(--mu)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:600}
.over{color:var(--er);font-weight:600}.mu{color:var(--mu);font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600}
.case{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mu)}
.hide{display:none}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:780px;width:94%;max-height:92vh;overflow:auto}.dt{display:flex;gap:6px}.dt select{flex:1;min-width:0;padding:9px 6px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.sc{border-radius:18px;overflow:hidden;background:var(--surf);color:var(--ink);margin-bottom:14px;font-family:'Noto Sans Thai',sans-serif}
.sc h1,.sc h2,.sc h3,.sc h4{font-family:'Noto Serif Thai','Noto Sans Thai',serif;color:var(--ink)}
.sc .hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;padding:26px 20px 104px;
  background:linear-gradient(180deg,#12293a 0%,#1d4a60 48%,#14333f 100%);min-height:250px}
.sc .hero>#bedfx{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%}
.sc .hero>h1,.sc .hero>p{position:relative;z-index:1}
.sc .hero h1{margin:0 0 8px;font-size:26px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.sc .hero h1 span{color:#9fd4e8}
.sc .hero p{margin:0;font-size:14px;opacity:.95;max-width:46ch;text-shadow:0 1px 14px rgba(0,0,0,.75)}
.sc .sb{padding:22px 18px}.sc .eb{font-size:13px;letter-spacing:.04em;color:var(--ink2)}
.sc h2{font-size:22px;margin:2px 0 6px}.sc .sub{font-size:14px;color:var(--ink2);margin:0 0 14px}
.sc label{color:var(--ink2)}.sc input,.sc select{background:var(--surf2);color:var(--ink);border-color:var(--bd)}
.seg{display:inline-flex;gap:6px;background:var(--fill);border-radius:14px;padding:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 14px;font:600 14px 'Noto Sans Thai',sans-serif;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--solid);color:var(--solid-tx)}
.bar{height:5px;background:var(--fill);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.cnt{font:12px monospace;color:var(--ink2);margin:6px 0 14px}
.qc{background:var(--surf2);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.tg{display:inline-block;background:var(--warm);color:var(--warm-tx);font:600 11px monospace;padding:2px 9px;border-radius:6px}
.qh{display:flex;gap:13px;align-items:flex-start}.qh>div{min-width:0}
.ic{flex:0 0 46px;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--warm),var(--warm2));color:var(--warm-tx);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--warm-bd);transition:transform .18s ease}
.ic svg{width:26px;height:26px}
.qc:hover .ic{transform:translateY(-2px) rotate(-3deg)}
@media(max-width:480px){.ic{flex-basis:38px;width:38px;height:38px;border-radius:12px}.ic svg{width:22px;height:22px}}
@media(prefers-reduced-motion:reduce){.ic{transition:none}.qc:hover .ic{transform:none}}
/* ---- ไอคอนขยับตอนเอาเมาส์ชี้ (แบบ gif 10 เฟรม ใช้ steps(10)) ---- */
.ic svg *{transform-box:fill-box;transform-origin:center}
@keyframes i-zz{0%{transform:translate(0,0);opacity:.3}40%{opacity:1}100%{transform:translate(2px,-5px);opacity:0}}
@keyframes i-steam{0%{transform:translateY(1px);opacity:.3}50%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
@keyframes i-look{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
@keyframes i-blinkbar{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes i-beat{0%,100%{transform:scale(1)}30%{transform:scale(1.13)}55%{transform:scale(.96)}}
@keyframes i-pulse{0%,100%{opacity:.5}40%{opacity:1}}
@keyframes i-needle{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(28deg)}}
@keyframes i-flip{to{transform:rotate(180deg)}}
@keyframes i-slide{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}
@keyframes i-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes i-bob2{0%,100%{transform:translateY(-2.5px)}50%{transform:translateY(0)}}
@keyframes i-page{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.78)}}
@keyframes i-page2{0%,100%{transform:scaleX(.82)}50%{transform:scaleX(1)}}
@keyframes i-flick{0%,100%{opacity:1}30%{opacity:.4}60%{opacity:.85}}
@keyframes i-wig{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes i-spin{to{transform:rotate(360deg)}}
@keyframes i-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes i-pop2{0%,100%{transform:scale(1.12)}50%{transform:scale(1)}}
@keyframes i-tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes i-tl1{0%,30%{opacity:1}31%,100%{opacity:.2}}
@keyframes i-tl2{0%,29%{opacity:.2}30%,62%{opacity:1}63%,100%{opacity:.2}}
@keyframes i-tl3{0%,61%{opacity:.2}62%,100%{opacity:1}}
.qc:hover .ic .p1,.qc:focus-within .ic .p1,
.qc:hover .ic .p2,.qc:focus-within .ic .p2,
.qc:hover .ic .p3,.qc:focus-within .ic .p3{animation-duration:1.1s;animation-timing-function:steps(10);animation-iteration-count:infinite}
.qc:hover .ic-S .p1,.qc:focus-within .ic-S .p1{animation-name:i-zz}
.qc:hover .ic-S .p2,.qc:focus-within .ic-S .p2{animation-name:i-zz;animation-delay:.3s}
.qc:hover .ic-T .p1,.qc:focus-within .ic-T .p1{animation-name:i-steam}
.qc:hover .ic-T .p2,.qc:focus-within .ic-T .p2{animation-name:i-steam;animation-delay:.35s}
.qc:hover .ic-O .p1,.qc:focus-within .ic-O .p1{animation-name:i-look}
.qc:hover .ic-O .p2,.qc:focus-within .ic-O .p2{animation-name:i-blinkbar}
.qc:hover .ic-P .p1,.qc:focus-within .ic-P .p1{animation-name:i-beat;animation-duration:.9s}
.qc:hover .ic-P .p2,.qc:focus-within .ic-P .p2{animation-name:i-pulse;animation-duration:.9s}
.qc:hover .ic-B .p1,.qc:focus-within .ic-B .p1{animation-name:i-needle;transform-origin:bottom}
.qc:hover .ic-A .p1,.qc:focus-within .ic-A .p1{animation-name:i-flip;animation-duration:1.6s}
.qc:hover .ic-N .p1,.qc:focus-within .ic-N .p1{animation-name:i-slide}
.qc:hover .ic-G .p1,.qc:focus-within .ic-G .p1{animation-name:i-bob}
.qc:hover .ic-G .p2,.qc:focus-within .ic-G .p2{animation-name:i-bob2}
.qc:hover .ic-e0 .p1,.qc:focus-within .ic-e0 .p1{animation-name:i-page;transform-origin:right}
.qc:hover .ic-e0 .p2,.qc:focus-within .ic-e0 .p2{animation-name:i-page2;transform-origin:left}
.qc:hover .ic-e1 .p1,.qc:focus-within .ic-e1 .p1{animation-name:i-flick}
.qc:hover .ic-e1 .p2,.qc:focus-within .ic-e1 .p2{animation-name:i-wig;transform-origin:bottom}
.qc:hover .ic-e2 .p1,.qc:focus-within .ic-e2 .p1{animation-name:i-bob}
.qc:hover .ic-e3 .p1,.qc:focus-within .ic-e3 .p1{animation-name:i-bob;animation-duration:.8s}
.qc:hover .ic-e3 .p2,.qc:focus-within .ic-e3 .p2{animation-name:i-spin;animation-duration:1.4s}
.qc:hover .ic-e4 .p1,.qc:focus-within .ic-e4 .p1{animation-name:i-bob}
.qc:hover .ic-e5 .p1,.qc:focus-within .ic-e5 .p1{animation-name:i-pop}
.qc:hover .ic-e5 .p2,.qc:focus-within .ic-e5 .p2{animation-name:i-pop2}
.qc:hover .ic-e6 .p1,.qc:focus-within .ic-e6 .p1{animation-name:i-pop}
.qc:hover .ic-e6 .p2,.qc:focus-within .ic-e6 .p2{animation-name:i-tilt;transform-origin:bottom}
.qc:hover .ic-e7 .p1,.qc:focus-within .ic-e7 .p1{animation-name:i-tl1;animation-duration:1.8s}
.qc:hover .ic-e7 .p2,.qc:focus-within .ic-e7 .p2{animation-name:i-tl2;animation-duration:1.8s}
.qc:hover .ic-e7 .p3,.qc:focus-within .ic-e7 .p3{animation-name:i-tl3;animation-duration:1.8s}
@media(prefers-reduced-motion:reduce){.qc:hover .ic *,.qc:focus-within .ic *{animation:none!important}}
.qc h4{font-size:17px;margin:8px 0 4px}.qc p{font-size:13px;color:var(--ink2);margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:13px;font:15px 'Noto Sans Thai',sans-serif;color:var(--ink);cursor:pointer}
.opts:not(.two) .opt{flex-direction:column;align-items:flex-start}
.opt em{font:12px monospace;color:var(--ink2);font-style:normal}.opt.sel{background:var(--solid);color:var(--solid-tx);border-color:var(--solid)}.opt.sel em{color:var(--solid-mu)}
.sum{background:var(--solid);color:var(--solid-tx);border-radius:18px;padding:20px;margin-top:18px}.sum h3{color:var(--solid-tx);margin:4px 0 14px;font-size:18px}
.sum .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum .two>div{background:var(--solid2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--solid-mu)}
.sum small{font:11px monospace;display:block;margin-bottom:4px}.sum b{color:var(--solid-tx);font-size:22px}
.sum hr{border:0;border-top:1px solid var(--solid-bd);margin:14px 0}#s3{font-size:14px}
.disc{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--ink2);margin-top:16px}
@media(max-width:480px){.sum .two{grid-template-columns:1fr}}
/* ---- #3 มือถือ: ปุ่มกดใหญ่ขึ้น อ่านง่ายขึ้น ---- */
@media(max-width:600px){
 .opt{min-height:56px;font-size:16px;padding:14px}
 .sc .sb{padding:18px 13px}.qc{padding:14px}.sc h2{font-size:20px}.sc .hero{padding:18px 15px}.sc .hero h1{font-size:22px}
 .opts{gap:8px}.sum{padding:16px}
 main{padding:12px}
}
/* ---- #4 โหมดผู้สูงอายุ: ขนาดตัวอักษร + คอนทราสต์สูง ---- */
:root[data-fs="l"] body{zoom:1.15}:root[data-fs="xl"] body{zoom:1.32}
.a11y{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--fill);border-radius:12px;padding:8px 10px;margin-bottom:14px;font-size:13px;color:var(--ink2)}
.a11y button{border:1px solid var(--bd);background:var(--surf2);color:var(--ink);border-radius:9px;padding:7px 13px;font:inherit;cursor:pointer;min-height:40px}
.a11y button.on{background:var(--solid);color:var(--solid-tx);border-color:var(--solid)}
.a11y .f1{font-size:13px}.a11y .f2{font-size:16px}.a11y .f3{font-size:19px}
/* สีเข้มชัด = เปลี่ยนค่า token ชุดเดียว ไม่ต้องไล่ override ทีละคอมโพเนนต์ */
:root[data-contrast="hi"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#303030;--bd:#1c2a4d;--ac:#0b4a63;--ac2:#fff;
  --surf:#fff;--surf2:#fff;--ink:#000;--ink2:#303030;--fill:#fff;
  --solid:#10203a;--solid2:#18305a;--solid-bd:#44599a;--solid-tx:#fff;--solid-mu:#e2e8f7;
  --meter:#0b1730;--warm:#fff;--warm2:#fff;--warm-bd:#1c2a4d;--warm-tx:#5a3a08;--on-ac:#fff}
:root[data-contrast="hi"] .sc .hero,:root[data-fs="l"] .sc .hero,:root[data-fs="xl"] .sc .hero{background:#1c2a4d;min-height:0;padding:22px 20px}
:root[data-contrast="hi"] #bedfx,:root[data-fs="l"] #bedfx,:root[data-fs="xl"] #bedfx{display:none!important}
@media (prefers-reduced-motion:reduce){#bedfx{display:none!important}.sc .hero{min-height:0;padding:22px 20px}}
:root[data-contrast="hi"] .qc,:root[data-contrast="hi"] .opt,:root[data-contrast="hi"] .disc{border:2px solid var(--bd)}
:root[data-contrast="hi"] .opt{font-weight:600}
/* ---- #1 จุดบอกความคืบหน้า ---- */
.dots{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.dots button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bd);background:var(--surf2);color:var(--ink2);font:600 13px 'Noto Sans Thai',sans-serif;cursor:pointer;padding:0;transition:transform .15s ease}
.dots button.f{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.dots button.cur{outline:3px solid var(--gold);outline-offset:1px}
.dots button:hover{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){.dots button{transition:none}.dots button:hover{transform:none}}
/* ---- #2 การ์ดสรุปผล ---- */
.res{background:var(--solid2);border-radius:14px;padding:14px 15px}
.res .rt{font:11px monospace;color:var(--solid-mu);display:block;margin-bottom:6px}
.res .rn{font-size:30px;font-weight:700;line-height:1.1;color:var(--solid-tx)}.res .rn small{font-size:14px;font-weight:400;color:var(--solid-mu)}
.meter{height:9px;border-radius:9px;background:var(--meter);overflow:hidden;margin:10px 0 8px}.meter i{display:block;height:100%;border-radius:9px;transition:width .35s ease}
.chip{display:inline-block;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;color:var(--chip-tx)}
.rmsg{font-size:13px;color:var(--solid-mu);margin-top:8px;line-height:1.5}
.cta{display:block;width:100%;margin-top:16px;background:var(--gold);color:var(--chip-tx);border:0;border-radius:13px;padding:15px;font:700 16px 'Noto Sans Thai',sans-serif;cursor:pointer;min-height:54px}
.cta:hover{background:var(--gold-h)}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
/* ---- #7 สถานะกำลังโหลด / ว่าง ---- */
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.empty{text-align:center;color:var(--mu);padding:26px 14px}.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:8px}
.skel{background:linear-gradient(90deg,var(--ac2),var(--bd),var(--ac2));background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:9px;height:15px;margin:9px 0}
@keyframes sk{to{background-position:-200% 0}}
.okbox{background:var(--okbg);border:1px solid var(--okbd);color:var(--oktx);border-radius:12px;padding:12px 14px;font-weight:600}
/* ---- #8 พิมพ์ใบประเมิน ---- */
#printArea{display:none}
@media print{
 body{background:#fff;color:#000;zoom:1}
 body>*{display:none!important}
 #printArea{display:block!important;font:13px/1.55 'Noto Sans Thai',sans-serif;color:#000;padding:0}
 #printArea h1{font-size:17px;margin:0 0 2px;text-align:center}
 #printArea .ph{text-align:center;font-size:12px;margin-bottom:12px}
 #printArea table{width:100%;border-collapse:collapse;margin-bottom:10px;min-width:0}
 #printArea th,#printArea td{border:1px solid #000;padding:5px 7px;font-size:12px;vertical-align:top;text-align:left}
 #printArea th{background:#eee;width:30%;font-weight:600}
 #printArea .sec{font-weight:700;margin:12px 0 5px;border-bottom:1.5px solid #000;padding-bottom:2px}

<body>
<header><h1>บริการตรวจการนอนหลับและติดตาม CPAP</h1><p>โรงพยาบาลศูนย์อนามัยที่ 10 อุบลราชธานี</p><div id="who" class="hide" style="margin-top:6px;font-size:13px"></div></header>
<main>
<div id="msg" class="note">กำลังเชื่อมต่อระบบ…</div>
<div class="tabs" id="tabs" style="margin-top:12px"></div>
<div id="app"></div>
<p id="stafflink" style="text-align:center;margin:22px 0"><a href="#" id="lgn" class="mu">เจ้าหน้าที่เข้าสู่ระบบ</a></p>

<div id="printArea"></div>
<dialog id="dlg"></dialog>
<dialog id="lg" style="max-width:360px"><h2>เจ้าหน้าที่เข้าสู่ระบบ</h2><label>ชื่อผู้ใช้</label><input id="lu" autocomplete="username"><label>รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password"><div id="le" class="over" style="margin-top:6px"></div><div class="row" style="margin-top:12px"><button class="btn pri" id="lgo">เข้าสู่ระบบ</button><button class="btn" id="lcl">ยกเลิก</button></div></dialog>
<script>
const STAGES=[
{k:"callback",n:"รอโทรกลับ",task:"โทรกลับและนัดประเมิน",own:"เจ้าหน้าที่รับนัด",d:2},
{k:"assess",n:"นัดประเมินและพบแพทย์",task:"ประเมินสุขภาพและพบแพทย์",own:"พยาบาล / แพทย์",d:7},
{k:"sleep",n:"รอตรวจการนอนหลับ",task:"ตรวจการนอนหลับ (PSG/HSAT)",own:"ห้องตรวจการนอนหลับ",d:14},
{k:"result",n:"รอรับรองผล / แจ้งผล",task:"รับรองผลและแจ้งผู้ป่วย",own:"แพทย์ / พยาบาลคลินิก",d:3},
{k:"device",n:"รอเครื่อง CPAP",task:"รับเครื่องและสอนใช้",own:"พยาบาล / ผู้สอนใช้เครื่อง",d:14},
{k:"follow",n:"ติดตามการใช้ CPAP",task:"โทรติดตามและทบทวนข้อมูลเครื่อง",own:"พยาบาล / แพทย์",d:14},
{k:"closed",n:"ปิดเคส",task:"-",own:"-",d:0}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sg=k=>STAGES.find(s=>s.k===k)||STAGES[0];
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>{if(!s||s==="-")return"-";const[y,m,d]=s.split("-");return d+"/"+m+"/"+(+y+543)};
let db,col,uid="",isStaff=false,view="patient",cases=[],ready=false,pub=true,flash="";

let lastSig="",isAdmin=false;
const API=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"fetch"},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error((j&&j.error)||"error"),{status:r.status});return j};
async function poll(first){
  try{const x=await API("GET","/api/cases"),sig=JSON.stringify(x);
    if(first||sig!==lastSig){lastSig=sig;cases=x;ready=true;if(view!=="admin")render()}}
  catch(e){if(e.status===401)location.reload()}
}
col={doc:id=>({set:d=>API("PUT","/api/cases/"+id,d).then(()=>poll()),update:d=>API("PATCH","/api/cases/"+id,d).then(r=>{if(r&&r._rev){const k=cases.find(x=>x.id===id);if(k)k._rev=r._rev}return poll()}),delete:()=>API("DELETE","/api/cases/"+id).then(()=>poll())})};
async function init(){
  try{const cfg=await API("GET","/api/config");CLINIC_PHONE=cfg.clinicPhone||""}catch(e){}
  $("#lgn").onclick=e=>{e.preventDefault();$("#lg").showModal();$("#lu").focus()};
  $("#lcl").onclick=()=>$("#lg").close();
  const go=async()=>{try{await API("POST","/api/login",{username:$("#lu").value,password:$("#lp").value});location.reload()}catch(e){$("#le").textContent=e.message}};
  $("#lgo").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()};
  try{
    const me=await API("GET","/api/me");
    if(!me.staff){render();return}
    uid="staff:"+me.username;isStaff=true;isAdmin=me.role==="admin";pub=false;view="staff";
    $("#stafflink").className="hide";$("#who").className="";
    $("#who").innerHTML=esc(me.name)+" ("+(isAdmin?"ผู้ดูแลระบบ":"เจ้าหน้าที่")+") · <a href='#' id='lo' style='color:inherit'>ออกจากระบบ</a>";
    $("#lo").onclick=async e=>{e.preventDefault();try{await API("POST","/api/logout")}catch(x){}location.reload()};
    await poll(true);setInterval(poll,5000);
  }catch(e){render()}
}
async function loadAdmin(){
  try{
    const[us,au]=await Promise.all([API("GET","/api/users"),API("GET","/api/audit")]);
    const dt=s=>new Date(s).toLocaleString("th-TH");
    $("#adm").innerHTML=`<h2>ผู้ใช้งานระบบ</h2><div class="scroll"><table><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr>
${us.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.display)}</td><td>${u.role==="admin"?"ผู้ดูแลระบบ":"เจ้าหน้าที่"}</td><td>${u.active?"ใช้งาน":"<span class='over'>ปิดใช้งาน</span>"}</td>
<td class="row"><button class="btn" data-pw="${u.id}">รีเซ็ตรหัสผ่าน</button><button class="btn" data-ac="${u.id}" data-v="${u.active?0:1}">${u.active?"ปิดใช้งาน":"เปิดใช้งาน"}</button><button class="btn" data-ro="${u.id}" data-v="${u.role==="admin"?"staff":"admin"}">${u.role==="admin"?"เปลี่ยนเป็นเจ้าหน้าที่":"เปลี่ยนเป็นผู้ดูแล"}</button></td></tr>`).join("")}</table></div>
<h3>เพิ่มผู้ใช้</h3><div class="g2"><div><label>ชื่อผู้ใช้ (อังกฤษ/ตัวเลข)</label><input id="nu"></div><div><label>ชื่อที่แสดง</label><input id="nd"></div><div><label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="np" type="password" autocomplete="new-password"></div><div><label>สิทธิ์</label><select id="nr"><option value="staff">เจ้าหน้าที่</option><option value="admin">ผู้ดูแลระบบ</option></select></div></div>
<p><button class="btn pri" id="nadd">เพิ่มผู้ใช้</button> <span id="nm" class="over"></span></p>
<h2 style="margin-top:22px">บันทึกการใช้งาน (ล่าสุด 300 รายการ)</h2><div class="scroll"><table><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>IP</th></tr>
${au.map(a=>`<tr><td>${esc(dt(a.ts))}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.ip)}</td></tr>`).join("")}</table></div>`;
    const patch=async(id,b)=>{try{await API("PATCH","/api/users/"+id,b);loadAdmin()}catch(e){alert(e.message)}};
    document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{const p=prompt("รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)");if(p)patch(b.dataset.pw,{password:p})});
    document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>patch(b.dataset.ac,{active:+b.dataset.v}));
    document.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>patch(b.dataset.ro,{role:b.dataset.v}));
    $("#nadd").onclick=async()=>{try{await API("POST","/api/users",{username:$("#nu").value,display:$("#nd").value,password:$("#np").value,role:$("#nr").value});loadAdmin()}catch(e){$("#nm").textContent=e.message}};
  }catch(e){$("#adm").textContent="โหลดไม่สำเร็จ"}
}
function tabs(){
  let h=`<button class="${view==="patient"?"on":""}" data-v="patient">${isStaff?"กรอกแทนผู้รับบริการ":"ผู้รับบริการ"}</button>`;
  if(isStaff)h+=`<button class="${view==="staff"?"on":""}" data-v="staff">เจ้าหน้าที่ดูแลระบบ</button>`;
  if(isAdmin)h+=`<button class="${view==="admin"?"on":""}" data-v="admin">ผู้ใช้งานและบันทึกการใช้งาน</button>`;
  $("#tabs").innerHTML=isStaff?h:"";
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;flash="";render()});
}
function render(){
  $("#msg").className="hide";tabs();
  if(view==="admin"&&isAdmin){$("#app").innerHTML='<div id="adm" class="card">กำลังโหลด…</div>';loadAdmin();return}
  $("#app").innerHTML=view==="staff"&&isStaff?staffHtml():patientHtml();
  view==="staff"&&isStaff?bindStaff():bindPatient();
  bedfx();
}

<div><label>ช่วงเวลาที่สะดวกให้โทรกลับ</label><select id="dtm">${["08:00–12:00","13:00–16:00","ไม่ระบุ"].map(x=>`<option${x===c.time?" selected":""}>${x}</option>`).join("")}</select></div>
<div><label>สถานะปัจจุบัน (แก้ได้หากบันทึกผิด)</label><select id="dsg">${STAGES.map(g=>`<option value="${g.k}"${g.k===c.stage?" selected":""}>${g.n}</option>`).join("")}</select></div>
<div><label>งานถัดไป</label><input id="dnt" value="${esc(c.nextTask)}"></div></div>
<label>HN (เชื่อมกับเวชระเบียนเมื่อยืนยันตัวตนแล้ว)</label><input id="dh" value="${esc(c.hn)}">
<label>ผู้รับผิดชอบ</label><input id="do" value="${esc(c.owner)}">
<label>วันครบกำหนด (วัน เดือน ปี)</label>${DI("dd",c.due,"fut")}
<label>บันทึกผลการติดต่อ / หมายเหตุ</label><textarea id="dn" rows="2" placeholder="เช่น โทรไม่ติด–นัดโทรซ้ำ, ขอเลื่อนนัด">${esc(c.note)}</textarea>
<div class="row" style="margin-top:12px"><button class="btn" id="ds">บันทึก</button>${nx?`<button class="btn pri" id="da">เสร็จงานนี้ → ${esc(nx.n)}</button>`:""}<button class="btn" id="del" style="color:var(--er)">ลบเคส</button></div><div id="dm" class="mu" style="margin-top:8px"></div>
<h3>ประวัติการส่งต่องาน</h3>${[...(c.log||[])].reverse().map(l=>`<div class="mu">${fd(l.d)} — ${esc(l.t)}</div>`).join("")}</div>
<div id="p2" class="hide"><div class="note">ข้อมูลประจำตัวควรดึงจากเวชระเบียนตาม HN ส่วนสัญญาณชีพและการวัดต่าง ๆ ให้กรอกตอนตรวจร่างกาย พร้อมวันที่ตรวจ</div>
<h3>ข้อมูลประจำตัว</h3><div class="g2">${I("hn","HN")}${I("fnTh","ชื่อ (ไทย)")}${I("lnTh","นามสกุล (ไทย)")}${I("fnEn","First name (อังกฤษ)")}${I("lnEn","Last name (อังกฤษ)")}${D("dob","วัน เดือน ปีเกิด","dob")}
<div><label>อายุ ณ วันที่รับบริการ</label><input id="a_age" readonly></div>${I("phone","เบอร์โทร","tel")}${SEL("rights","สิทธิ์การรักษา",RIGHTS)}${I("rightsOther","สิทธิ์อื่น ๆ (ระบุ)")}</div>${T("addr","ที่อยู่",2)}
<h3>อาการและประวัติ</h3><div class="g2">${T("symptoms","อาการสำคัญ",2)}${T("sleepHx","ประวัติการนอน",2)}</div>
<h3>ประวัติสุขภาพ</h3><div class="g2">${SEL("allergy","แพ้ยา สารเคมี หรืออาหาร",[["deny","ปฏิเสธ"],["has","มี"],["unknown","ยังไม่ทราบ"]])}${I("allergyWhat","สารที่แพ้")}${I("allergyRx","อาการแพ้")}
${SEL("cd","โรคประจำตัว",[["","เลือก"],["none","ไม่มี"],["has","มี"]])}</div>
<div id="cdbox" class="${a.cd==="has"?"":"hide"}"><label>หากมี ให้เลือกและระบุ</label>${CB("hyp","HT")}${CB("dm","DM")}${CB("dlp","DLP")}${CB("othOn","อื่น ๆ")}<input id="a_otherDz" placeholder="อื่น ๆ โปรดระบุ" value="${esc(a.otherDz)}" style="margin-top:8px"></div>
<div class="g2">${T("meds","รายการยาประจำ",2)}</div>
<h3>ตรวจร่างกาย (กรอกตอนตรวจร่างกาย)</h3><div class="g2">${D("mdate","วัน เดือน ปี ที่ตรวจร่างกาย","fut")}${I("wt","น้ำหนัก (กก.)","number")}${I("h","ส่วนสูง (ซม.)","number")}<div><label>BMI (คำนวณอัตโนมัติ)</label><input id="a_bmi" readonly></div>
${I("bp","ความดันโลหิต (mmHg)","text","120/80")}${I("pr","ชีพจร (ครั้ง/นาที)","number")}${I("rr","อัตราหายใจ (ครั้ง/นาที)","number")}${I("temp","อุณหภูมิ (°C)","number")}${I("spo2","SpO₂ ขณะตื่น (%)","number")}${I("neck","รอบคอ (ซม.)","number")}${I("waist","รอบเอว (ซม.)","number")}</div>
<h3>คะแนนคัดกรอง</h3><div class="g2">${I("sb","STOP-BANG (0–8)","number")}${I("ess","ESS (0–24)","number")}${D("sdate","วัน เดือน ปี ที่ประเมิน","fut")}</div>
<h3>คำสั่งแพทย์และการตรวจการนอนหลับ</h3><div class="g2">${SEL("testType","ประเภทการตรวจการนอนหลับ",[["PSG","PSG (ในห้องปฏิบัติการ)"]])}${I("doctor","แพทย์ผู้สั่ง")}${D("sleepDate","วัน เดือน ปี ที่มาตรวจ Sleep test","fut")}${SEL("sleepRoom","ห้องตรวจ Sleep test",[["","เลือก"],["1","ห้อง 1"],["2","ห้อง 2"]])}${T("indication","ข้อบ่งชี้",2)}${T("plan","แผนแพทย์ / คำสั่งอื่น ๆ",2)}</div>
<label>ตรวจเพิ่มเติม (ติ๊กเมื่อสั่ง พร้อมวันติดตามผล — จะแสดง "รอผลตรวจเพิ่มเติม" ในทะเบียน)</label>
${TESTS.map(x=>{const v=t[x[0]]||{};return `<div class="row" style="margin-top:6px"><label style="display:inline-flex;gap:6px;align-items:center;margin:0;color:var(--tx);min-width:150px"><input type="checkbox" id="t_on_${x[0]}" style="width:auto"${v.on?" checked":""}>${x[1]}</label>${x[0]==="oth"?`<input id="t_name_oth" placeholder="ระบุรายการ" value="${esc(v.name)}" style="flex:1;min-width:120px">`:""}<div style="min-width:260px;flex:1">${DI("t_due_"+x[0],v.due,"fut")}</div></div>`}).join("")}
<h3>บันทึกในวัน Sleep test (ทวนและวัดซ้ำ)</h3><div class="g2">${D("s_mdate","วัน เดือน ปี ที่วัด","fut")}${I("s_wt","น้ำหนัก (กก.)","number")}${I("s_h","ส่วนสูง (ซม.)","number")}<div><label>BMI (คำนวณอัตโนมัติ)</label><input id="a_s_bmi" readonly></div>${I("s_bp","ความดันโลหิต (mmHg)","text","120/80")}${I("s_pr","ชีพจร (ครั้ง/นาที)","number")}${I("s_rr","อัตราหายใจ (ครั้ง/นาที)","number")}${I("s_temp","อุณหภูมิ (°C)","number")}${I("s_spo2","SpO₂ ขณะตื่น (%)","number")}${I("s_neck","รอบคอ (ซม.)","number")}${I("s_waist","รอบเอว (ซม.)","number")}${T("s_note","ทวนข้อมูลสำคัญ / เหตุการณ์และหมายเหตุวันตรวจ",2)}</div>
<p><button class="btn pri" id="as">บันทึกการประเมิน</button> <button class="btn" id="apr">พิมพ์ / บันทึก PDF</button> <span id="am" class="mu"></span></p></div>`;
  $("#apr").onclick=()=>printAssess(c);
  d.showModal();
  const bm=(x,y,o)=>{const w=+$("#a_"+x).value,h=+$("#a_"+y).value;$("#a_"+o).value=w>0&&h>0?(w/((h/100)**2)).toFixed(1):""};const calc=()=>{bm("wt","h","bmi");bm("s_wt","s_h","s_bmi");
    const b=getD("a_dob"),r=getD("a_mdate")||today();if(b){const x=new Date(b),y=new Date(r);let ag=y.getFullYear()-x.getFullYear();if(y<new Date(y.getFullYear(),x.getMonth(),x.getDate()))ag--;$("#a_age").value=ag>=0?ag+" ปี":""}else $("#a_age").value=""};
  $("#p2").addEventListener("input",calc);$("#p2").addEventListener("change",calc);calc();
  $("#a_cd").onchange=()=>$("#cdbox").classList.toggle("hide",$("#a_cd").value!=="has");
  d.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{d.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#p1").classList.toggle("hide",b.dataset.p!=="p1");$("#p2").classList.toggle("hide",b.dataset.p!=="p2")});
  $("#dx").onclick=()=>d.close();
  const get=()=>({name:$("#dnm").value.trim()||c.name,phone:$("#dph").value.trim(),time:$("#dtm").value,stage:$("#dsg").value,nextTask:$("#dnt").value.trim(),hn:$("#dh").value.trim(),owner:$("#do").value.trim(),due:getD("dd"),note:$("#dn").value.trim()});
  $("#dsg").onchange=()=>{const g=sg($("#dsg").value);$("#dnt").value=g.task;$("#do").value=g.own};
  $("#del").onclick=()=>{$("#dm").innerHTML='ลบเคสนี้ถาวร? <button class="btn" id="dy" style="color:var(--er)">ยืนยันลบ</button> <button class="btn" id="dc">ยกเลิก</button>';
    $("#dy").onclick=async()=>{try{await col.doc(id).delete();d.close()}catch(e){$("#dm").textContent="ลบไม่สำเร็จ"}};$("#dc").onclick=()=>{$("#dm").textContent=""}};
  $("#ds").onclick=async()=>{const v=get();const log=[...(c.log||[])];
    if(v.note&&v.note!==c.note)log.push({d:today(),t:"บันทึก: "+v.note});
    if(v.stage!==c.stage)log.push({d:today(),t:"แก้ไขสถานะเป็น: "+sg(v.stage).n});else if(v.name!==c.name||v.phone!==c.phone)log.push({d:today(),t:"แก้ไขข้อมูลผู้รับบริการ"});
    try{await col.doc(id).update({...v,log,_rev:c._rev});d.close()}catch(e){$("#dm").textContent=saveErr(e)}};
  if(nx)$("#da").onclick=async()=>{const v=get();const log=[...(c.log||[]),{d:today(),t:`เสร็จ "${c.nextTask}" → ${nx.n}`}];
    try{await col.doc(id).update({name:v.name,phone:v.phone,time:v.time,hn:v.hn,note:v.note,stage:nx.k,nextTask:nx.task,owner:nx.own,due:nx.d?addDays(nx.d):"-",log,_rev:c._rev});d.close()}catch(e){$("#dm").textContent=saveErr(e)}};
  $("#as").onclick=async()=>{
    const o={};AK.forEach(k=>{const e=$("#a_"+k);o[k]=e.type==="checkbox"?e.checked:e.value.trim()});
    DK.forEach(k=>o[k]=getD("a_"+k));
    if(o.cd!=="has"){o.hyp=o.dm=o.dlp=o.othOn=false;o.otherDz=""}
    o.bmi=$("#a_bmi").value;o.s_bmi=$("#a_s_bmi").value;
    if(o.sleepDate&&o.sleepRoom){const cf=cases.find(x=>x.id!==id&&x.assess&&x.assess.sleepDate===o.sleepDate&&x.assess.sleepRoom===o.sleepRoom);if(cf){$("#am").textContent="ห้อง "+o.sleepRoom+" วันที่ "+fd(o.sleepDate)+" มีนัดแล้ว ("+cf.name+") กรุณาเลือกห้องหรือวันอื่น";return}}o.tests={};TESTS.forEach(x=>{o.tests[x[0]]={on:$("#t_on_"+x[0]).checked,due:getD("t_due_"+x[0])}});o.tests.oth.name=$("#t_name_oth").value.trim();
    const nmTh=(o.fnTh+" "+o.lnTh).trim();
    const log=[...(c.log||[]),{d:today(),t:"บันทึกประเมินก่อนตรวจ"+(Object.values(o.tests).some(v=>v&&v.on)?" (สั่งตรวจเพิ่มเติม)":"")}];
    try{await col.doc(id).update({assess:o,hn:o.hn||c.hn,phone:o.phone||c.phone,log,_rev:c._rev});$("#am").textContent="บันทึกแล้ว"}catch(e){$("#am").textContent=saveErr(e)}};
}

/* ---------- ฉากห้องนอนกลางคืนบนหัวหน้าแรก ----------
   Canvas 2D ล้วน ไม่มีไลบรารีและไม่โหลดอะไรจากข้างนอก ใช้ได้ตอนเน็ตหลุด
   ปิดเองเมื่อ: สีเข้มชัด / ตัวอักษรใหญ่ / prefers-reduced-motion / วาดไม่สำเร็จ
   อยู่เฉพาะหัวหน้าแรกของผู้รับบริการ ไม่มีในแบบประเมินและหน้าเจ้าหน้าที่ */
let bfxRaf=null,bfxT=null;
function bedfxOff(){
  const R=document.documentElement;
  return R.getAttribute("data-contrast")==="hi"
      || R.getAttribute("data-fs")==="l" || R.getAttribute("data-fs")==="xl"
      || (window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches);
}
function bedfx(){
  if(bfxRaf){cancelAnimationFrame(bfxRaf);bfxRaf=null}
  const cv=$("#bedfx"); if(!cv) return;
  if(bedfxOff()){cv.style.display="none";return}
  cv.style.display="block";
  let ctx; try{ctx=cv.getContext("2d")}catch(e){}
  if(!ctx){cv.style.display="none";return}

  let W=0,H=0,dpr=1,back=null,mid=null,front=null,lmap=null,lctx=null;
  const mk=(w,h)=>{const c=document.createElement("canvas");c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
  let sd=1337; const rn=()=>((sd=(sd*1664525+1013904223)%4294967296)/4294967296);
  const rr=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
    g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);
    g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()};

  function paint(){
    const r=cv.getBoundingClientRect();
    W=Math.max(300,Math.round(r.width)); H=Math.max(180,Math.round(r.height));
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const PW=W+46, PH=H+26;

    back=mk(PW,PH); const b=back.getContext("2d");
    const sk=b.createLinearGradient(0,0,0,PH);
    sk.addColorStop(0,"#0f2436");sk.addColorStop(.5,"#1b4760");sk.addColorStop(1,"#2b6880");
    b.fillStyle=sk;b.fillRect(0,0,PW,PH);
    sd=1337;
    for(let i=0;i<120;i++){b.globalAlpha=rn()*.75+.25;b.fillStyle="#eaf8ff";
      b.beginPath();b.arc(rn()*PW,rn()*PH*.7,rn()*1.3+.35,0,6.283);b.fill()}
    b.globalAlpha=1;
    const mx=PW*.76,my=PH*.24,mr=Math.max(7,H*.05);
    const mg=b.createRadialGradient(mx,my,0,mx,my,H*.62);
    mg.addColorStop(0,"rgba(255,255,255,.9)");mg.addColorStop(.12,"rgba(205,236,250,.45)");
    mg.addColorStop(1,"rgba(160,205,235,0)");b.fillStyle=mg;b.fillRect(0,0,PW,PH);
    b.fillStyle="#fff";b.beginPath();b.arc(mx,my,mr,0,6.283);b.fill();
    let x=-12;
    while(x<PW){const bw=14+rn()*38,bh=H*(.10+rn()*.27);
      b.fillStyle="#0e2a38";b.fillRect(x,H*.78-bh,bw,bh+30);
      b.fillStyle="rgba(255,206,138,.5)";
      for(let k=0;k<3;k++) if(rn()>.58) b.fillRect(x+3+rn()*(bw-7),H*.78-bh+5+rn()*Math.max(1,bh-10),2.5,3);
      x+=bw+2+rn()*8}

    mid=mk(PW,PH); const m=mid.getContext("2d");
    const wx=PW*.30,wy=H*.06,ww=PW*.46,wh=H*.70;
    m.strokeStyle="#2b4a5c";m.lineWidth=Math.max(7,H*.035);m.strokeRect(wx,wy,ww,wh);
    m.lineWidth=Math.max(4,H*.018);
    m.beginPath();m.moveTo(wx+ww/2,wy);m.lineTo(wx+ww/2,wy+wh);
    m.moveTo(wx,wy+wh*.46);m.lineTo(wx+ww,wy+wh*.46);m.stroke();
    m.strokeStyle="rgba(196,232,252,.38)";m.lineWidth=2;
    m.strokeRect(wx+7,wy+7,ww-14,wh-14);
    m.fillStyle="#24414f";m.fillRect(wx-14,wy+wh,ww+28,Math.max(6,H*.028));
    const cw=PW*.21;
    const pans=[[0,1],[PW-cw,-1]];
    for(let pi=0;pi<pans.length;pi++){
      const px0=pans[pi][0], flip=pans[pi][1];
      for(let i=0;i<14;i++){const t=i/13,sh=Math.sin(t*Math.PI*4.4+(flip<0?1.4:0));
        m.fillStyle="rgba(22,50,66,"+Math.max(.12,.62+sh*.22)+")";
        m.fillRect(px0+t*cw,0,cw/13+2,PH)}
    }
    m.fillStyle="rgba(14,34,46,.85)";m.fillRect(0,0,PW,Math.max(5,H*.03));

    front=mk(PW,PH); const f=front.getContext("2d");
    const bW=Math.min(PW*.70,H*2.1), bH=H*.46, bx=(PW-bW)/2, by=PH-bH;
    const hbW=bW*.60,hbX=bx+(bW-hbW)/2,hbTop=by+bH*.04,hbBot=by+bH*.62;
    f.fillStyle="#2d4859";
    f.beginPath();f.moveTo(hbX,hbBot);f.lineTo(hbX,hbTop+bH*.16);
    f.quadraticCurveTo(hbX+hbW/2,hbTop-bH*.10,hbX+hbW,hbTop+bH*.16);
    f.lineTo(hbX+hbW,hbBot);f.closePath();f.fill();
    f.strokeStyle="rgba(185,222,242,.5)";f.lineWidth=2.5;
    f.beginPath();f.moveTo(hbX,hbTop+bH*.16);
    f.quadraticCurveTo(hbX+hbW/2,hbTop-bH*.10,hbX+hbW,hbTop+bH*.16);f.stroke();
    f.fillStyle="#82a2b5";
    f.beginPath();f.moveTo(bx+bW*.07,by+bH*.58);f.lineTo(bx+bW*.93,by+bH*.58);
    f.lineTo(bx+bW*1.06,PH);f.lineTo(bx-bW*.06,PH);f.closePath();f.fill();
    const pw=hbW*.46,ph=bH*.26;
    const pls=[[hbX+hbW*.27,-.05],[hbX+hbW*.73,.045]];
    for(let qi=0;qi<pls.length;qi++){
      const pcx=pls[qi][0], rot=pls[qi][1];
      f.save();f.translate(pcx,by+bH*.50);f.rotate(rot);
      f.fillStyle="rgba(8,20,28,.4)";rr(f,-pw/2+3,-ph/2+4,pw,ph,ph*.32);f.fill();
      f.fillStyle="#a7c2d2";rr(f,-pw/2,-ph/2,pw,ph,ph*.34);f.fill();
      f.strokeStyle="rgba(42,74,92,.5)";f.lineWidth=2;
      rr(f,-pw/2+5,-ph/2+5,pw-10,ph-10,ph*.26);f.stroke();f.restore();
    }
    const dTop=by+bH*.74;
    f.fillStyle="#688798";
    f.beginPath();f.moveTo(bx-bW*.06,PH);f.lineTo(bx+bW*.03,dTop);
    for(let dx=bx+bW*.03;dx<=bx+bW*.97;dx+=Math.max(8,bW/28))
      f.lineTo(dx,dTop+Math.sin((dx-bx)/(bW*.11))*bH*.035);
    f.lineTo(bx+bW*1.06,PH);f.closePath();f.fill();
    f.strokeStyle="#55747f";f.lineWidth=2.5;
    for(let k=0;k<6;k++){const fx=bx+bW*(.12+k*.155);
      f.beginPath();f.moveTo(fx,dTop+bH*.07);f.quadraticCurveTo(fx-bW*.02,PH-bH*.08,fx-bW*.04,PH);f.stroke()}

    lmap=mk(Math.max(40,W>>1),Math.max(28,H>>1)); lctx=lmap.getContext("2d");
  }

  const breath=t=>{const c=(t%10)/10;
    if(c<.40) return .55+.45*Math.sin((c/.40)*Math.PI*.5);
    if(c<.70) return 1-.45*Math.sin(((c-.40)/.30)*Math.PI*.5);
    return .55-.25*Math.sin(((c-.70)/.30)*Math.PI)};

  let mxp=.5,myp=.55,tx=.5,ty=.55,last=0;
  if(window.__bfxMove) window.removeEventListener("pointermove",window.__bfxMove);
  window.__bfxMove=function(e){const r=cv.getBoundingClientRect();
    if(!r.width||!r.height)return;
    tx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    ty=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    last=performance.now()};
  window.addEventListener("pointermove",window.__bfxMove,{passive:true});

  try{paint()}catch(e){cv.style.display="none";return}
  const t0=performance.now();

  function frame(now){
    bfxRaf=requestAnimationFrame(frame);
    if(document.hidden) return;
    const r=cv.getBoundingClientRect();
    if(!r.width) return;
    if(Math.abs(r.width-W)>2||Math.abs(r.height-H)>2){ try{paint()}catch(e){return} }
    const t=(now-t0)/1000;
    if(now-last>3500){tx=.5+.26*Math.sin(t*.21);ty=.55+.13*Math.sin(t*.143+1.1)}
    mxp+=(tx-mxp)*.055; myp+=(ty-myp)*.055;
    const br=breath(t), px=(mxp-.5), py=(myp-.5);

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(back ,-23-px*20, -13-py*10, W+46, H+26);
    ctx.drawImage(mid  ,-23-px*34, -13-py*16, W+46, H+26);
    ctx.drawImage(front,-23-px*52, -13-py*22, W+46, H+26);

    const lw=lmap.width, lh=lmap.height;
    lctx.globalCompositeOperation="source-over";
    lctx.fillStyle="#4b606f"; lctx.fillRect(0,0,lw,lh);
    lctx.globalCompositeOperation="lighter";
    const gm=lctx.createRadialGradient(lw*.76,lh*.26,0,lw*.76,lh*.26,lh*1.25);
    gm.addColorStop(0,"rgba(150,190,225,"+(.45+.4*br).toFixed(3)+")");
    gm.addColorStop(1,"rgba(120,165,205,0)");
    lctx.fillStyle=gm;lctx.fillRect(0,0,lw,lh);
    const gl=lctx.createRadialGradient(mxp*lw,myp*lh,0,mxp*lw,myp*lh,lh*.95);
    gl.addColorStop(0,"rgba(255,186,96,"+(.52+.4*br).toFixed(3)+")");
    gl.addColorStop(1,"rgba(255,170,80,0)");
    lctx.fillStyle=gl;lctx.fillRect(0,0,lw,lh);

    ctx.globalCompositeOperation="multiply";
    ctx.drawImage(lmap,0,0,W,H);
    ctx.globalCompositeOperation="source-over";
  }
  bfxRaf=requestAnimationFrame(frame);
}
window.addEventListener("resize",()=>{clearTimeout(bfxT);bfxT=setTimeout(bedfx,150)});
if(window.MutationObserver) new MutationObserver(()=>bedfx())
  .observe(document.documentElement,{attributes:true,attributeFilter:["data-fs","data-contrast"]});
render();init();
</script>
